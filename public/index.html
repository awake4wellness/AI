<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Awake4Wellness · Plataforma Clínica</title>
    <meta name="description" content="Gestión clínica, seguimiento y recuperación personalizada en un solo lugar." />
    <meta name="theme-color" content="#10B8A6" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Awake4Wellness" />
    <meta property="og:title" content="Awake4Wellness · Plataforma Clínica" />
    <meta property="og:description" content="Gestión clínica, seguimiento y recuperación personalizada en un solo lugar." />
    <meta property="og:image" content="https://awake4.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://awake4.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://awake4.app/og.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      body { background:#060B16; font-family:'DM Sans',sans-serif; overflow-x:hidden; }
      button, input, select, textarea { font-family:inherit; }
      .app-sidebar { width:240px; padding:18px 14px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; flex:0 0 240px; background:#060B16; z-index:80; }
      .app-header { min-height:58px; padding:10px 28px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
      .app-content { padding:28px; }
      .menu-button { display:none; background:transparent; border:1px solid rgba(148,163,184,.16); color:#94a3b8; border-radius:9px; padding:6px 9px; cursor:pointer; }
      .signout-button { display:flex; }
      .stats-grid { grid-template-columns:repeat(4,minmax(0,1fr)); }
      .quick-grid { grid-template-columns:repeat(4,minmax(0,1fr)); }
      .sidebar-backdrop { display:none; }
      ::-webkit-scrollbar { width:4px; }
      ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:99px; }
      select option { background:#1e293b; color:#e2e8f0; }
      @media (max-width:1080px) {
        .stats-grid, .quick-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      }
      @media (max-width:820px) {
        .app-sidebar { position:fixed; left:0; transform:translateX(-105%); transition:transform .2s ease; box-shadow:12px 0 40px rgba(0,0,0,.42); }
        .app-sidebar.is-open { transform:translateX(0); }
        .sidebar-backdrop { display:block; position:fixed; inset:0; border:0; background:rgba(2,6,23,.72); z-index:70; }
        .menu-button { display:block; }
        .app-header { padding:10px 16px; }
        .app-content { padding:18px 16px 32px; }
        .user-email { display:none; }
        .signout-button { display:none; }
      }
      @media (max-width:560px) {
        .stats-grid, .quick-grid { grid-template-columns:1fr; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
